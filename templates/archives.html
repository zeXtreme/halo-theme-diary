<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${site.language ?: 'zh'}">
<head th:replace="~{_layout :: head('归档 - ' + ${site.title}, false)}"></head>
<body>
<div id="app">
  <div th:replace="~{_layout :: mobile}"></div>
  <div id="content">
    <div id="streamContainer" class="stream-container">
      <div class="post-list-container post-list-container-shadow">
        <th:block th:each="yearEntry : ${archives}">
          <div class="archive-year" th:text="${yearEntry.year} + '年'"></div>
          <th:block th:each="monthEntry : ${yearEntry.months}">
            <div class="archive-month" th:text="${#numbers.formatInteger(monthEntry.month, 1)} + '月'"></div>
            <th:block th:each="post : ${monthEntry.posts}">
              <a th:href="${post.status.permalink}" class="a-block">
                <div class="post-item-wrapper">
                  <div class="post-item post-item-no-gaps">
                    <div class="post-item-info-wrapper">
                      <div class="post-item-title" th:text="${post.spec.title}"></div>
                      <div class="post-item-meta">
                        <time th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"></time>
                      </div>
                    </div>
                  </div>
                </div>
              </a>
            </th:block>
          </th:block>
        </th:block>
      </div>
    </div>
  </div>
  <div th:replace="~{_layout :: sidebar}"></div>
</div>
<script th:src="@{/themes/theme-diary/assets/js/journal.js}"></script>
</body>
</html>
