<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${site.language ?: 'zh'}">
<head th:replace="~{_layout :: head('瞬间 - ' + ${site.title}, false)}"></head>
<body>
<div id="app">
  <div th:replace="~{_layout :: mobile}"></div>
  <div id="content">
    <div id="streamContainer" class="stream-container">
      <div class="post-list-container post-list-container-shadow">
        <div class="post-item-wrapper post-item-wrapper-no-hover">
          <div class="post-item post-item-no-gaps">
            <div class="post-item-info-wrapper">
              <div class="post-item-title post-item-title-small">瞬间</div>
            </div>
          </div>
        </div>
        <th:block th:each="moment : ${moments.items}">
          <div class="moment-card">
            <!-- 头部：头像 + 用户名 + 时间 -->
            <div class="moment-header">
              <img th:if="${moment.owner.avatar}" th:src="${moment.owner.avatar}"
                   class="moment-avatar" th:alt="${moment.owner.displayName}">
              <div th:unless="${moment.owner.avatar}" class="moment-avatar moment-avatar-fallback"
                   th:text="${#strings.substring(moment.owner.displayName, 0, 1)}"></div>
              <span class="moment-author" th:text="${moment.owner.displayName}"></span>
              <time class="moment-time"
                    th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}"></time>
            </div>
            <!-- 正文 -->
            <div class="moment-body" th:utext="${moment.spec.content.html}"></div>
            <!-- 图片网格 -->
            <th:block th:if="${not #lists.isEmpty(moment.spec.content.medium)}">
              <div class="moment-media">
                <th:block th:each="media : ${moment.spec.content.medium}">
                  <div th:if="${media.type.name == 'PHOTO'}" class="moment-photo-item"
                       th:attr="data-url=${media.url}" onclick="openLightbox(this)">
                    <img th:src="${media.url}" alt="">
                  </div>
                </th:block>
              </div>
            </th:block>
            <!-- 底部：点赞 + 评论数 -->
            <div class="moment-footer">
              <button class="moment-action-btn"
                      th:attr="data-name=${moment.metadata.name},data-count=${moment.stats.upvote}"
                      onclick="toggleUpvote(this)">
                <i class="material-icons">favorite_border</i>
                <span th:text="${moment.stats.upvote}">0</span>
              </button>
              <button class="moment-action-btn"
                      th:attr="onclick='toggleComment(\'comment-' + ${moment.metadata.name} + '\')'">
                <i class="material-icons">chat_bubble_outline</i>
                <span th:text="${moment.stats.approvedComment}">0</span>
              </button>
            </div>
            <!-- 评论 -->
            <div class="moment-comment-wrapper" th:id="'comment-' + ${moment.metadata.name}" style="display:none">
              <halo:comment group="moment.halo.run" kind="Moment" th:attr="name=${moment.metadata.name}"/>
            </div>
          </div>
        </th:block>
        <div th:if="${moments.hasPrevious() || moments.hasNext()}" class="pagination">
          <a class="pagination-action" th:if="${moments.hasPrevious()}" th:href="${moments.prevUrl}" style="opacity:1">
            <i class="material-icons pagination-action-icon">chevron_left</i>
          </a>
          <a class="pagination-action" th:unless="${moments.hasPrevious()}" style="opacity:0">
            <i class="material-icons pagination-action-icon">chevron_left</i>
          </a>
          <div class="pagination-indicator">
            <span th:text="${moments.page} + '/' + ${moments.totalPages}"></span>
          </div>
          <a class="pagination-action" th:if="${moments.hasNext()}" th:href="${moments.nextUrl}" style="opacity:1">
            <i class="material-icons pagination-action-icon">chevron_right</i>
          </a>
          <a class="pagination-action" th:unless="${moments.hasNext()}" style="opacity:0">
            <i class="material-icons pagination-action-icon">chevron_right</i>
          </a>
        </div>
      </div>
    </div>
  </div>
  <div th:replace="~{_layout :: sidebar}"></div>
  <div id="extraContainer" class="extra-container">
    <div class="pagination">
      <a id="globalBackToTop" class="pagination-action" href="#top" style="visibility:hidden">
        <i class="material-icons pagination-action-icon">keyboard_arrow_up</i>
      </a>
      <a th:if="${moments.hasPrevious()}" class="pagination-action" th:href="${moments.prevUrl}">
        <i class="material-icons pagination-action-icon">chevron_left</i>
      </a>
      <a th:unless="${moments.hasPrevious()}" class="pagination-action" style="visibility:hidden">
        <i class="material-icons pagination-action-icon">chevron_left</i>
      </a>
      <div class="pagination-indicator" th:if="${moments.hasPrevious() || moments.hasNext()}">
        <span th:text="${moments.page} + ' / ' + ${moments.totalPages}"></span>
      </div>
      <a th:if="${moments.hasNext()}" class="pagination-action" th:href="${moments.nextUrl}">
        <i class="material-icons pagination-action-icon">chevron_right</i>
      </a>
      <a th:unless="${moments.hasNext()}" class="pagination-action" style="visibility:hidden">
        <i class="material-icons pagination-action-icon">chevron_right</i>
      </a>
    </div>
  </div>
</div>
<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out">
  <img id="lightbox-img" src="" alt="" style="max-width:90vw;max-height:90vh;border-radius:5px;object-fit:contain">
</div>
<script th:src="@{/themes/halo-theme-diary/assets/js/journal.js}"></script>
<script>
function openLightbox(el) {
  document.getElementById('lightbox-img').src = el.dataset.url;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

var UPVOTE_KEY = 'diary-upvote.moment.names';
function getUpvoted() {
  try { return JSON.parse(localStorage.getItem(UPVOTE_KEY) || '[]'); } catch(e) { return []; }
}
function toggleUpvote(btn) {
  var name = btn.dataset.name;
  var upvoted = getUpvoted();
  if (upvoted.indexOf(name) !== -1) return;
  fetch('/apis/api.halo.run/v1alpha1/trackers/upvote', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({group: 'moment.halo.run', plural: 'moments', name: name})
  }).then(function(r) {
    if (!r.ok) return;
    upvoted.push(name);
    localStorage.setItem(UPVOTE_KEY, JSON.stringify(upvoted));
    var span = btn.querySelector('span');
    span.textContent = parseInt(span.textContent) + 1;
    btn.classList.add('upvoted');
    btn.querySelector('.material-icons').textContent = 'favorite';
  });
}
function toggleComment(id) {
  var el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

document.addEventListener('DOMContentLoaded', function() {
  var upvoted = getUpvoted();
  document.querySelectorAll('[data-name]').forEach(function(btn) {
    if (upvoted.indexOf(btn.dataset.name) !== -1) {
      btn.classList.add('upvoted');
      btn.querySelector('.material-icons').textContent = 'favorite';
    }
  });
});
</script>
</body>
</html>
