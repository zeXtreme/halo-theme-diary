<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${site.language ?: 'zh'}">
<head th:replace="~{_layout :: head('图库 - ' + ${site.title}, false)}"></head>
<body>
<div id="app">
  <div th:replace="~{_layout :: mobile}"></div>
  <div id="content">
    <div id="streamContainer" class="stream-container">
      <div class="post-list-container post-list-container-shadow">
        <div class="post-item-wrapper post-item-wrapper-no-hover">
          <div class="post-item post-item-no-gaps">
            <div class="post-item-info-wrapper">
              <div class="post-item-title post-item-title-small">图库</div>
              <!-- 分组筛选 -->
              <div class="post-item-meta" style="flex-wrap:wrap;gap:6px;margin-top:8px">
                <a th:href="@{/photos}" class="btn btn-outline-secondary rounded-pill btn-sm"
                   th:classappend="${#strings.isEmpty(param.group)} ? ' active' : ''">全部</a>
                <th:block th:each="group : ${groups}">
                  <a th:href="@{/photos(group=${group.metadata.name})}"
                     class="btn btn-outline-secondary rounded-pill btn-sm"
                     th:classappend="${#lists.contains(param.group, group.metadata.name)} ? ' active' : ''"
                     th:text="${group.spec.displayName}"></a>
                </th:block>
              </div>
            </div>
          </div>
        </div>

        <!-- 图片网格 -->
        <div class="post-item-wrapper post-item-wrapper-no-hover">
          <div class="post-item post-item-no-divider" style="flex-direction:column;align-items:flex-start">
            <div class="post-item-info-wrapper" style="width:100%">
              <div class="photo-grid">
                <th:block th:each="photo : ${photos.items}">
                  <div class="photo-grid-item"
                       th:attr="data-url=${photo.spec.url},data-title=${photo.spec.displayName}"
                       onclick="openLightbox(this)">
                    <img th:src="${photo.spec.url}" th:alt="${photo.spec.displayName}"
                         style="width:100%;height:120px;object-fit:cover;border-radius:5px;display:block">
                    <div class="photo-grid-caption" th:text="${photo.spec.displayName}"></div>
                  </div>
                </th:block>
              </div>
            </div>
          </div>
        </div>

        <!-- 分页 -->
        <div th:if="${photos.hasPrevious() || photos.hasNext()}" class="pagination">
          <a class="pagination-action" th:if="${photos.hasPrevious()}" th:href="${photos.prevUrl}" style="opacity:1">
            <i class="material-icons pagination-action-icon">chevron_left</i>
          </a>
          <a class="pagination-action" th:unless="${photos.hasPrevious()}" style="opacity:0">
            <i class="material-icons pagination-action-icon">chevron_left</i>
          </a>
          <div class="pagination-indicator">
            <span th:text="${photos.page} + '/' + ${photos.totalPages}"></span>
          </div>
          <a class="pagination-action" th:if="${photos.hasNext()}" th:href="${photos.nextUrl}" style="opacity:1">
            <i class="material-icons pagination-action-icon">chevron_right</i>
          </a>
          <a class="pagination-action" th:unless="${photos.hasNext()}" style="opacity:0">
            <i class="material-icons pagination-action-icon">chevron_right</i>
          </a>
        </div>
      </div>
    </div>
  </div>
  <div th:replace="~{_layout :: sidebar}"></div>
  <div id="extraContainer" class="extra-container">
    <div class="pagination">
      <a id="globalBackToTop" class="pagination-action" href="#top" style="visibility:hidden">
        <i class="material-icons pagination-action-icon">keyboard_arrow_up</i>
      </a>
      <a th:if="${photos.hasPrevious()}" class="pagination-action" th:href="${photos.prevUrl}">
        <i class="material-icons pagination-action-icon">chevron_left</i>
      </a>
      <a th:unless="${photos.hasPrevious()}" class="pagination-action" style="visibility:hidden">
        <i class="material-icons pagination-action-icon">chevron_left</i>
      </a>
      <div class="pagination-indicator" th:if="${photos.hasPrevious() || photos.hasNext()}">
        <span th:text="${photos.page} + ' / ' + ${photos.totalPages}"></span>
      </div>
      <a th:if="${photos.hasNext()}" class="pagination-action" th:href="${photos.nextUrl}">
        <i class="material-icons pagination-action-icon">chevron_right</i>
      </a>
      <a th:unless="${photos.hasNext()}" class="pagination-action" style="visibility:hidden">
        <i class="material-icons pagination-action-icon">chevron_right</i>
      </a>
    </div>
  </div>
</div>

<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out">
  <img id="lightbox-img" src="" alt="" style="max-width:90vw;max-height:90vh;border-radius:5px;object-fit:contain">
</div>

<script th:src="@{/themes/halo-theme-diary/assets/js/journal.js}"></script>
<script>
function openLightbox(el) {
  var lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = el.dataset.url;
  lb.style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
