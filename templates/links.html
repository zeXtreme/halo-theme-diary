<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${site.language ?: 'zh'}">
<head th:replace="~{_layout :: head('友链 - ' + ${site.title}, false)}"></head>
<body>
<div id="app">
  <div th:replace="~{_layout :: mobile}"></div>
  <div id="content">
    <div id="streamContainer" class="stream-container">
      <div class="post-list-container post-list-container-shadow">
        <div class="post-item-wrapper post-item-wrapper-no-hover">
          <div class="post-item post-item-no-gaps">
            <div class="post-item-info-wrapper">
              <div class="post-item-title post-item-title-small">友链</div>
            </div>
          </div>
        </div>
        <th:block th:each="group : ${groups}">
          <div class="post-item-wrapper post-item-wrapper-no-hover">
            <div class="post-item post-item-no-divider" style="flex-direction:column;align-items:flex-start">
              <div class="post-item-info-wrapper" style="width:100%">
                <div class="archive-month" th:text="${group.spec.displayName}"></div>
                <div class="links-grid">
                  <a th:each="link : ${group.links}" th:href="${link.spec.url}"
                     target="_blank" rel="noopener" class="link-card">
                    <img th:if="${link.spec.logo}" th:src="${link.spec.logo}"
                         th:alt="${link.spec.displayName}" class="link-logo"
                         th:attr="onerror='this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\''">
                    <div class="link-logo link-logo-fallback"
                         th:style="${link.spec.logo} ? 'display:none' : ''"
                         th:text="${#strings.substring(link.spec.displayName, 0, 1)}"></div>
                    <div class="link-info">
                      <div class="link-name" th:text="${link.spec.displayName}"></div>
                      <div th:if="${link.spec.description}" class="link-desc"
                           th:text="${link.spec.description}"></div>
                    </div>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </th:block>
      </div>
    </div>
  </div>
  <div th:replace="~{_layout :: sidebar}"></div>
</div>
<script th:src="@{/themes/halo-theme-diary/assets/js/journal.js}"></script>
</body>
</html>
